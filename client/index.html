<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multi-platform business management ecosystem" />
    <meta name="facebook-domain-verification" content="tnc5snt9xsg0qxmmr25fvj3zae7v2t" />
    <title>TriadBlue</title>

    <!-- Favicon - Multiple sizes for global visibility (server rewrites per-subdomain) -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/triadblue/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/triadblue/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicons/triadblue/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/triadblue/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/triadblue/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicons/triadblue/favicon.png" />

    <!-- Web App Manifest for PWA/Desktop Shortcuts -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Social Media (will be converted to absolute URL by boot script) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TriadBlue" />
    <meta property="og:description" content="Multi-platform business management ecosystem" />
    <meta property="og:image" content="/favicons/triadblue/favicon-512x512.png" data-need-absolute />
    <meta property="og:url" content="" data-need-absolute-url />

    <!-- Twitter Card (will be converted to absolute URL by boot script) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TriadBlue" />
    <meta name="twitter:description" content="Multi-platform business management ecosystem" />
    <meta name="twitter:image" content="/favicons/triadblue/favicon-512x512.png" data-need-absolute />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Expletus+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- OGA: Online Global Assets (managed at console.blue) -->
    <script src="https://console.blue/api/oga/embed.js?key=OGA_KEY_TRIADBLUE" async></script>
  </head>
  <body>
    <script>
      (function() {
        const savedTheme = localStorage.getItem("theme");
        const theme = savedTheme || "dark";
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
        
        const baseUrl = window.location.origin;
        const currentUrl = window.location.href;
        
        const metasNeedingAbsolute = document.querySelectorAll('[data-need-absolute]');
        metasNeedingAbsolute.forEach(function(meta) {
          if (meta.content && meta.content.startsWith('/')) {
            meta.content = baseUrl + meta.content;
          }
        });
        
        const urlMetas = document.querySelectorAll('[data-need-absolute-url]');
        urlMetas.forEach(function(meta) {
          meta.content = currentUrl;
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
      <script src="https://console.blue/widget/task-capture.js" data-project="triadblue" async></script>
  </body>
</html>
